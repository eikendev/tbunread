[package]
name = "tbunread"
version = "0.0.12"
authors = ["eikendev"]
edition = "2024"
description = "Helps you to keep an eye on unread emails in Thunderbird."
homepage = "https://github.com/eikendev/tbunread"
repository = "https://github.com/eikendev/tbunread"
readme = "README.md"
license = "ISC"

# Matches the assets uploaded by release.yaml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[dependencies]
anyhow = "1.0.104"
argh = "0.1.19"
dirs = "7.0.0"
env_logger = "0.11.11"
glob = "0.3.4"
human-panic = "2.0.8"
log = "0.4.34"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
regex = "1.13.1"
rust-ini = "0.21.3"
sysinfo = "0.39.6"
