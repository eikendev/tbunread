[package]
name = "tbunread"
version = "0.0.10"
authors = ["eikendev"]
edition = "2024"
description = "Helps you to keep an eye on unread emails in Thunderbird."
homepage = "https://github.com/eikendev/tbunread"
repository = "https://github.com/eikendev/tbunread"
readme = "README.md"
license = "ISC"

# Matches the assets uploaded by release.yaml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[dependencies]
anyhow = "1.0.41"
argh = "0.1.4"
dirs = "3.0.2"
env_logger = "0.8.3"
glob = "0.3.0"
human-panic = "2.0.4"
lazy_static = "1.4.0"
log = "0.4.14"
notify = "4.0.17"
regex = "1.5.4"
rust-ini = "0.17.0"
sysinfo = "0.20.3"
